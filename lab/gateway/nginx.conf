# Gateway TLS del modo endurecido: termina TLS, fuerza HTTPS y aplica límite
# de tasa a /login como control adicional al rate limit de la aplicación
# (defensa en profundidad: dos capas independientes para el mismo riesgo).
# El límite del gateway es más holgado a propósito, para que el control de la
# aplicación (5 intentos/minuto por cuenta) sea el que actúe primero y quede
# demostrado en las evidencias.

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Todo el tráfico en claro del modo endurecido se redirige a TLS.
    location / {
        return 301 https://$host:18443$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/lab.crt;
    ssl_certificate_key /etc/nginx/tls/lab.key;

    # Solo protocolos y cifrados modernos (A02: fallas criptográficas).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS: el navegador no vuelve a intentar HTTP contra este host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;

    location = /login {
        limit_req zone=login_zone nodelay;
        limit_req_status 429;

        proxy_pass http://app-hard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app-hard:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
