    <text x="668" y="388" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">sesión + HMAC-SHA256</text>
    <text x="668" y="408" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">RBAC revalidado · TOTP</text>
    <text x="668" y="428" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">CSP · auditoría</text>
    <text x="668" y="448" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">consultas parametrizadas</text>
  <rect x="980" y="130" width="290" height="200" rx="10" fill="#101b2b" stroke="#58a6ff" stroke-width="2"/>
    <text x="998" y="156" fill="#a3c9f7" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">db · PostgreSQL 16</text>
