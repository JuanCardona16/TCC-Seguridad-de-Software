  <rect width="1280" height="860" fill="#0d1117" data-contenedor="1"/>

  <text x="40" y="44" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700">MiniGestor Documental — arquitectura del laboratorio</text>
  <text x="40" y="68" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Un binario, dos políticas de seguridad · todo publicado sobre 127.0.0.1 · datos simulados</text>

  <rect x="40" y="90" width="230" height="520" rx="14" fill="#11161d" stroke="#30363d" stroke-dasharray="7 6" data-contenedor="1"/>
    <text x="58" y="114" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">Host Linux · 127.0.0.1</text>
  <rect x="310" y="90" width="620" height="570" rx="14" fill="#11161d" stroke="#30363d" stroke-dasharray="7 6" data-contenedor="1"/>
    <text x="330" y="112" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">lab_net · bridge 172.28.60.0/24 · red aislada</text>
  <rect x="58" y="132" width="194" height="92" rx="10" fill="#1c2330" stroke="#8b949e" stroke-width="2"/>
    <text x="76" y="158" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Navegador / auditor</text>
