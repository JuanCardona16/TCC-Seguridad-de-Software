    <text x="940" y="388" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" text-anchor="middle">escritura</text>
  <polyline points="470,500 470,470" fill="none" stroke="#8b949e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#punta-gris)"/>
    <text x="470" y="490" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" text-anchor="middle">captura .pcap</text>
  <text x="334" y="800" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Las dos versiones comparten esquema de datos pero no instancia: las evidencias antes/después no se contaminan.</text>
    <text x="334" y="822" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Ningún puerto se publica fuera de 127.0.0.1; la base de datos no publica puerto alguno.</text>
