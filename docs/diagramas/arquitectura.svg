    <text x="998" y="440" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">v1: contenido en claro</text>
    <text x="998" y="460" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">v2: nombre opaco (uuid)</text>
    <text x="998" y="480" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">v2: AES-256-GCM + tag</text>
  <rect x="334" y="686" width="590" height="86" rx="10" fill="#1c2330" stroke="#8b949e" stroke-width="2"/>
    <text x="352" y="712" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">firewall · nftables (perfil tools)</text>
    <text x="352" y="736" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">política drop por defecto · solo 443 desde lab_net</text>
    <text x="352" y="756" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">registro de intentos rechazados</text>
  <rect x="40" y="630" width="230" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="654" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Leyenda</text>
  <rect x="58" y="668" width="13" height="13" fill="#1f1215" stroke="#f85149" stroke-width="2"/>
  <text x="82" y="679" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">superficie vulnerable (v1)</text>
