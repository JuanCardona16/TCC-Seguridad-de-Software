  <text x="82" y="727" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">datos estructurados</text>
  <rect x="58" y="740" width="13" height="13" fill="#241a08" stroke="#d29922" stroke-width="2"/>
