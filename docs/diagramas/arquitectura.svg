    <text x="668" y="176" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">terminación TLS</text>
    <text x="668" y="198" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">TLS 1.2 / 1.3 · AEAD</text>
    <text x="668" y="218" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">HSTS · 301 desde :18083</text>
  <rect x="650" y="280" width="250" height="240" rx="10" fill="#0f2117" stroke="#3fb950" stroke-width="2"/>
    <text x="668" y="306" fill="#9ae6b4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">app-hard · :8080</text>
    <text x="668" y="326" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">MODE=hardened</text>
    <text x="668" y="348" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Argon2id (19 MiB, t=2)</text>
