    <text x="76" y="202" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Burp · ZAP (proxy)</text>
  <rect x="58" y="236" width="194" height="84" rx="10" fill="#1c2330" stroke="#8b949e" stroke-width="2"/>
    <text x="76" y="262" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Suite de ataques</text>
    <text x="76" y="286" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">curl · sqlmap · hydra</text>
    <text x="76" y="306" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">attacks/*.sh</text>
  <rect x="58" y="332" width="194" height="92" rx="10" fill="#1c2330" stroke="#8b949e" stroke-width="2"/>
    <text x="76" y="358" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Panel de evidencias</text>
    <text x="76" y="382" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">ejecuta ataques</text>
    <text x="76" y="402" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">en vivo desde 18090</text>
  <text x="58" y="474" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">Sin herramientas de seguridad</text>
    <text x="58" y="494" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">instaladas en el host: todo</text>
    <text x="58" y="514" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">vive en contenedores</text>
  <rect x="334" y="250" width="270" height="220" rx="10" fill="#1f1215" stroke="#f85149" stroke-width="2"/>
    <text x="352" y="276" fill="#ffb3ae" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">app-vuln · :18080</text>
    <text x="352" y="296" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">MODE=vulnerable</text>
    <text x="352" y="318" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">MD5 sin sal</text>
    <text x="352" y="338" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">cookie usuario:rol</text>
    <text x="352" y="358" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">SQL concatenado</text>
    <text x="352" y="378" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">salida sin escapar</text>
    <text x="352" y="398" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">sin verificar dueño</text>
    <text x="352" y="418" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">/debug/config expuesto</text>
  <rect x="334" y="500" width="270" height="130" rx="10" fill="#1c2330" stroke="#8b949e" stroke-width="2"/>
    <text x="352" y="526" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">attacker · netshoot</text>
    <text x="352" y="546" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">captura de tráfico</text>
    <text x="352" y="568" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">tcpdump sobre el bridge</text>
    <text x="352" y="588" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">NET_ADMIN / NET_RAW</text>
    <text x="352" y="608" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">perfil: tools</text>
