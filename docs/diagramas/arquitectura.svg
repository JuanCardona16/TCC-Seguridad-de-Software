    <text x="998" y="218" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">minigestor_vuln</text>
    <text x="998" y="238" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">minigestor_hard</text>
    <text x="998" y="258" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">users · documents</text>
    <text x="998" y="278" fill="#c9d1d9" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">sessions · audit_log</text>
  <rect x="980" y="370" width="290" height="150" rx="10" fill="#241a08" stroke="#d29922" stroke-width="2"/>
